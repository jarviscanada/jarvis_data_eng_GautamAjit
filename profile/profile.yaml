# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a Linux cluster monitoring solution to collect and analyze hardware specifications and server utilization metrics (CPU, memory, and resource usage) for infrastructure capacity planning. Built automated Bash and PostgreSQL scripts to capture and store system data in a Docker-provisioned PostgreSQL database, with Git used for version control. Implemented scheduled monitoring using Cron to collect usage metrics every minute, enabling continuous performance tracking. Designed the MVP on a single node with a scalable architecture capable of supporting multi-node Linux clusters.
  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: Developed a customer analytics proof of concept for a UK-based online retailer to uncover purchasing patterns and support data-driven marketing decisions. Leveraged Python, Pandas, NumPy, and Jupyter Notebook to perform data cleaning, transformation, exploratory data analysis (EDA), and customer segmentation on transactional sales data. Analyzed customer behavior, purchasing trends, and revenue drivers to generate actionable insights for targeted marketing campaigns, customer retention initiatives, and high-value customer acquisition.
  - name: "Spark on Databricks"
    git_url: "/spark"
    description: Worked on Azure Databricks clusters, ingesting data via the native Lakeflow Connect using a serverless cluster, via Azure Data Factory (ADF) and unity catalog volumes. Implemented the Medallion Architecture to load and transform raw financial transactional data to build a fraud analytics dashboard. Built DLT pipelines to extract stock market data through an API to build a dashboard that visualizes key stock market metrics like Daily price movement, Price trend over 7, 30, and 90 days, Daily percentage change, Trading volume trends & Company-level performance comparisons
  - name: "Credit Scoring pipeline"
    git_url: "/capstone"
    description: Developed a machine learning risk assessment model for an international consumer finance provider to predict loan applicant default likelihood, specifically targeting individuals with limited or no traditional credit history. Integrated primary application data with external credit bureau records to engineer predictive features and evaluate repayment capacity. Optimized classification performance to enable data-driven lending decisions and expand credit access safely.
 
# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "FedNLP: An Interpretable NLP system to decode Federal Reserve communications"
    git_url: ""
    description: Developed FedNLP, an interpretable Natural Language Processing (NLP) system to predict Federal Funds Rate movements from Federal Open Market Committee (FOMC) communications. Applied advanced NLP techniques and attention-based neural network architectures to analyze financial text, achieving 74% prediction accuracy. Engineered text processing and modeling pipelines to identify influential terms and phrases driving model predictions, improving transparency and enabling deeper insights into monetary policy signals.

