# Introduce yourself, your academic and professional background.
# What excites you about the software industry and your passion. At least 80 words
summary: Driven by a passion for transforming data into intelligent solutions, I am a Machine Learning and Data Science professional skilled in Python, SQL, ML, and analytics. I am particularly excited by ML for its ability to uncover patterns, enable prediction, and continuously improve decision-making. Through the Jarvis Machine Learning Engineering program, I built Linux Cluster Monitoring tools, ETL workflows using Pandas and NumPy, and worked on retail store data to improve customer satisfaction and retention, strengthening my data engineering and analytics capabilities. I further explored DLT & ETL pipelines through Azure Databricks, working on stock market and financial transactional data, and recently built an end-to-end pipeline to improve credit scoring and assess how likely is an applicant to default on their loan. I enjoy developing predictive models and leveraging data to solve real-world problems and drive meaningful impact.

